name: Publish the pupil paper

on:
  push:
    branches: [claude/year-5-11plus-tutoring-o0qi5z]
    paths: [docs/**, index.html, lessons/**, reference/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages for this repository if it is not already
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble the site — the cube page at the root, the paper under /paper/
        run: |
          mkdir -p site/paper
          cp index.html site/
          cp -r lessons reference site/ 2>/dev/null || true
          cp docs/*.html site/paper/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
